services:
  device-emulator:
    build: .
    image: mininms/device-emulator:0.1.0
    container_name: device-emulator
    # REST наружу; SNMP-агенты устройств 101..302 — на UDP 1161-1166
    ports:
      - "8085:8085"
      - "1161-1166:1161-1166/udp"
    restart: unless-stopped
    healthcheck:
      # bash есть в базовом образе; /dev/tcp — минимальный TCP-пробник без curl
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8085'"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s

# Свой парк устройств можно подмонтировать файлом:
#   volumes:
#     - ./emulator-devices.yml:/app/emulator-devices.yml:ro
# (application.yml подключает ./emulator-devices.yml, если файл существует)