# =============================================================================
# Парк виртуальных устройств эмулятора «Мини-NMS».
#
# Поля устройства:
#   id         — идентификатор, под которым устройство заведено в реестре NMS
#   name       — имя (отдаётся и по SNMP в sysName)
#   type       — код типа из справочника device_types NMS (ROUTER / OLT / BTS)
#   snmp-port  — UDP-порт SNMP-агента этого устройства (161 в docker-compose
#                смапливается на 1161/1162/... хоста; null — SNMP не поднимать)
#   community  — community string v2c
#
# Поля метрики:
#   type        — код из справочника metric_type NMS
#   unit        — единица измерения (только для REST/отображения)
#   min / max   — абсолютные границы значения (только kind: numeric)
#   normal-low / normal-high — границы нормы (сюда возвращается при RECOVERY)
#   step        — максимальный сдвиг за тик симуляции (шум живого графика)
#   snmp-type   — gauge (по умолчанию), integer (нужен для отрицательных)
#                или counter32 (для kind=counter; по умолчанию counter64)
#   kind        — numeric (по умолчанию), string или counter (наружу отдаётся
#                монотонно растущая сумма; min/max/норма/step задают скорость прироста)
#   mode        — режим строковой метрики: scenario (значение следует за активным
#                сценарием устройства; values — по кодам 0..5 = NORMAL, HIGH_LOAD,
#                FAILURE, RECOVERY, SILENT, FLAPPING) или static (постоянное value)
#
# OID всех метрик заданы явно — справочник metric_type→OID заморожен для
# стабильности интеграции с NMS (авто-нумерация OidMapper по алфавиту
# сдвигала бы номера при добавлении новых типов):
#   ACTIVE_CALLS=.1       CPU_UTILIZATION=.2    IF_IN_UTILIZATION=.3
#   IF_OUT_UTILIZATION=.4 MEMORY_UTILIZATION=.5 ONT_COUNT=.6
#   PON_UTILIZATION=.7    RF_POWER=.8           TEMPERATURE=.9
#   DEVICE_STATUS=.10     FIRMWARE_VERSION=.11  LOCATION=.12
#   IF_IN_OCTETS=.13      IF_OUT_OCTETS=.14     PON_CRC_ERRORS=.15
#   DROPPED_CALLS=.16
# Опрос значения — по экземпляру «OID типа + .0» (конвенция SNMP для скаляров,
# как sysUpTime 1.3.6.1.2.1.1.3.0): например, CPU_UTILIZATION → ...99990.2.0.
# =============================================================================

emulator:
  devices:
    # ------------------------- Роутеры (ядро сети) -------------------------
    - id: 101
      name: msk-core-rtr-01
      type: ROUTER
      snmp-port: 1161
      community: public
      metrics: &router-metrics
        - type: CPU_UTILIZATION
          unit: "%"
          min: 0
          max: 100
          normal-low: 5
          normal-high: 40
          step: 3
          oid: 1.3.6.1.4.1.99990.2
        - type: MEMORY_UTILIZATION
          unit: "%"
          min: 0
          max: 100
          normal-low: 20
          normal-high: 70
          step: 2
          oid: 1.3.6.1.4.1.99990.5
        - type: IF_IN_UTILIZATION
          unit: "%"
          min: 0
          max: 100
          normal-low: 10
          normal-high: 60
          step: 4
          oid: 1.3.6.1.4.1.99990.3
        - type: IF_OUT_UTILIZATION
          unit: "%"
          min: 0
          max: 100
          normal-low: 10
          normal-high: 60
          step: 4
          oid: 1.3.6.1.4.1.99990.4
        - type: TEMPERATURE
          unit: "°C"
          min: 15
          max: 80
          normal-low: 20
          normal-high: 45
          step: 1
          oid: 1.3.6.1.4.1.99990.9
        # строковые метрики: статус следует за активным сценарием, инвентарь постоянен
        - type: DEVICE_STATUS
          kind: string
          mode: scenario
          values: [OK, DEGRADED, CRITICAL, RECOVERING, UNREACHABLE, DEGRADED]
          oid: 1.3.6.1.4.1.99990.10
        - type: FIRMWARE_VERSION
          kind: string
          mode: static
          value: "IOS-XR 24.1.1"
          oid: 1.3.6.1.4.1.99990.11
        - type: LOCATION
          kind: string
          mode: static
          value: "MSK-DC1"
          oid: 1.3.6.1.4.1.99990.12
        # счётчики: конфиг описывает скорость прироста (октетов/с), наружу — накопленная сумма
        - type: IF_IN_OCTETS
          unit: "окт"
          kind: counter
          min: 0
          max: 12500000          # 100 Мбит/с = 12,5 МБ/с
          normal-low: 1000000
          normal-high: 5000000
          step: 200000
          oid: 1.3.6.1.4.1.99990.13
        - type: IF_OUT_OCTETS
          unit: "окт"
          kind: counter
          min: 0
          max: 12500000
          normal-low: 1000000
          normal-high: 5000000
          step: 200000
          oid: 1.3.6.1.4.1.99990.14

    - id: 102
      name: msk-core-rtr-02
      type: ROUTER
      snmp-port: 1162
      community: public
      metrics: *router-metrics

    # ------------------------------ OLT (PON) ------------------------------
    - id: 201
      name: spb-olt-01
      type: OLT
      snmp-port: 1163
      community: public
      metrics: &olt-metrics
        - type: CPU_UTILIZATION
          unit: "%"
          min: 0
          max: 100
          normal-low: 5
          normal-high: 45
          step: 3
          oid: 1.3.6.1.4.1.99990.2
        - type: MEMORY_UTILIZATION
          unit: "%"
          min: 0
          max: 100
          normal-low: 20
          normal-high: 70
          step: 2
          oid: 1.3.6.1.4.1.99990.5
        - type: ONT_COUNT
          unit: "шт"
          min: 0
          max: 1024
          normal-low: 200
          normal-high: 600
          step: 5
          oid: 1.3.6.1.4.1.99990.6
        - type: PON_UTILIZATION
          unit: "%"
          min: 0
          max: 100
          normal-low: 10
          normal-high: 70
          step: 3
          oid: 1.3.6.1.4.1.99990.7
        - type: DEVICE_STATUS
          kind: string
          mode: scenario
          values: [OK, DEGRADED, CRITICAL, RECOVERING, UNREACHABLE, DEGRADED]
          oid: 1.3.6.1.4.1.99990.10
        - type: FIRMWARE_VERSION
          kind: string
          mode: static
          value: "PON-OS 16.1.4"
          oid: 1.3.6.1.4.1.99990.11
        - type: LOCATION
          kind: string
          mode: static
          value: "SPB-DC2"
          oid: 1.3.6.1.4.1.99990.12
        # счётчик ошибок: в норме почти не растёт, FAILURE разгоняет скорость
        - type: PON_CRC_ERRORS
          unit: "шт"
          kind: counter
          min: 0
          max: 1000
          normal-low: 0
          normal-high: 2
          step: 1
          snmp-type: counter32
          oid: 1.3.6.1.4.1.99990.15

    - id: 202
      name: spb-olt-02
      type: OLT
      snmp-port: 1164
      community: public
      metrics: *olt-metrics

    # ------------------------------- BTS (радио) ----------------------------
    - id: 301
      name: kln-bts-01
      type: BTS
      snmp-port: 1165
      community: public
      metrics: &bts-metrics
        - type: CPU_UTILIZATION
          unit: "%"
          min: 0
          max: 100
          normal-low: 5
          normal-high: 50
          step: 3
          oid: 1.3.6.1.4.1.99990.2
        - type: MEMORY_UTILIZATION
          unit: "%"
          min: 0
          max: 100
          normal-low: 20
          normal-high: 70
          step: 2
          oid: 1.3.6.1.4.1.99990.5
        - type: RF_POWER
          unit: "dBm"
          min: -60
          max: -20
          normal-low: -50
          normal-high: -35
          step: 1
          snmp-type: integer
          oid: 1.3.6.1.4.1.99990.8
        - type: TEMPERATURE
          unit: "°C"
          min: 15
          max: 75
          normal-low: 20
          normal-high: 50
          step: 1
          oid: 1.3.6.1.4.1.99990.9
        - type: ACTIVE_CALLS
          unit: "шт"
          min: 0
          max: 5000
          normal-low: 100
          normal-high: 800
          step: 20
          oid: 1.3.6.1.4.1.99990.1
        - type: DEVICE_STATUS
          kind: string
          mode: scenario
          values: [OK, DEGRADED, CRITICAL, RECOVERING, UNREACHABLE, DEGRADED]
          oid: 1.3.6.1.4.1.99990.10
        - type: FIRMWARE_VERSION
          kind: string
          mode: static
          value: "5G-RAN 3.1"
          oid: 1.3.6.1.4.1.99990.11
        - type: LOCATION
          kind: string
          mode: static
          value: "KLN-DC3"
          oid: 1.3.6.1.4.1.99990.12
        # счётчик обрывов: в норме почти не растёт, FAILURE разгоняет скорость
        - type: DROPPED_CALLS
          unit: "шт"
          kind: counter
          min: 0
          max: 50
          normal-low: 0
          normal-high: 1
          step: 1
          oid: 1.3.6.1.4.1.99990.16

    - id: 302
      name: kln-bts-02
      type: BTS
      snmp-port: 1166
      community: public
      metrics: *bts-metrics